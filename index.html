function scene(i){return `<div class="art"><svg viewBox="0 0 400 400" role="img" aria-label="${t().h1.slice(0,10)}"><rect width="400" height="400" fill="#F2F3F1"/><rect y="300" width="400" height="100" fill="#D9DFDC"/><rect x="40" y="120" width="130" height="8" rx="4" fill="#9DA9A3"/><rect x="60" y="92" width="26" height="28" rx="4" fill="#fff"/><rect x="96" y="76" width="22" height="44" rx="4" fill="#9DA9A3" opacity=".6"/><rect x="250" y="70" width="110" height="140" rx="10" fill="#fff" stroke="#9DA9A3" stroke-width="4"/><circle cx="110" cy="250" r="0"/><rect x="210" y="230" width="170" height="80" rx="14" fill="#9DA9A3"/><rect x="220" y="205" width="150" height="40" rx="12" fill="#fff"/><path d="M90 300v-60M90 240a30 30 0 0 1 40-5" stroke="#343B3B" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="138" cy="238" r="12" fill="#343B3B"/>${i!=null?`<g transform="translate(300 140) scale(2.4) translate(-12 -12)" fill="none" stroke="#343B3B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[i]}"/></g>`:""}</svg></div>`}
const price=()=>CFG.rate?`<strong>${CFG.rate}</strong>`:t().pu;
function cards(){return `<div class="grid">${O.map((ci,i)=>{const c=C[ci];return `<article class="card"><div class="thumb">${ic(ci)}</div><div class="cb"><h3>${c.n[li()]}</h3><p>${c.d[li()]}</p>${ci==3?"":`<details><summary>${t().more}</summary><ul>${c.w[li()].map(x=>`<li>${x}</li>`).join("")}</ul></details>`}</div></article>`}).join("")}</div>`}
function R(){return ["wa","tg","ph"].map(k=>B(k,1)).join("")}
function aboutBlock(){return `<section><div class="wrap" style="max-width:720px"><h2>${t().at}</h2>${t().ab.map(p=>`<p>${p}</p>`).join("")}</div></section>`}
function contactBlock(){return `<section><div class="wrap"><div class="box"><h2>${t().ct}</h2><p>${t().cs}</p><div class="cta">${BS(1)}</div></div></div></section>`}
function priceBlock(){return `<section><div class="wrap"><div class="box"><h2>${t().pt}</h2><h3>${t().hr}</h3>${CFG.rate?`<p style="font-size:1.2rem">${price()}</p>`:""}<p class="note">${t().pn}</p><div class="cta">${B("wa")}${B("tg")}</div></div></div></section>`}
function view(p){
if(p.startsWith("cat-")){const i=+p.slice(4)-1,k=O[i]!=null?O[i]:O[0],c=C[k];return {title:c.n[li()],html:`<section><div class="wrap"><p><a href="${h("services")}">${t().back}</a></p><div class="two"><div><h1 style="font-size:clamp(1.8rem,5vw,2.8rem)">${c.n[li()]}</h1><p>${c.d[li()]}</p><h3>${t().works}</h3><ul class="w">${c.w[li()].map(x=>`<li>${x}</li>`).join("")}</ul>${k==4?`<p class="note">${t().elec}</p>`:""}<p><strong>${t().hr}.</strong> ${price()}</p></div>${scene(k)}</div><div class="box" style="margin-top:32px"><h3>${t().disc}</h3><div class="cta">${BS()}</div></div></div></section>`}}
if(p=="services")return {title:t().st,html:`<section><div class="wrap"><h1 style="font-size:clamp(1.9rem,5vw,2.8rem);margin-bottom:28px">${t().st}</h1>${cards()}</div></section>`};
if(p=="prices")return {title:t().pt,html:priceBlock()};
if(p=="about")return {title:t().at,html:aboutBlock()};
if(p=="contacts")return {title:t().ct,html:contactBlock()};
return {title:"",html:`<div class="wrap hero"><div><h1>${t().h1}</h1><p>${t().sub}</p><button class="btn" data-open>${t().cta}</button></div></div><section class="alt"><div class="wrap"><h2>${t().st}</h2>${cards()}</div></section>${priceBlock()}`}}
function render(){
let m=(location.hash.slice(1)||"").match(/^(ru|en)-(.+)$/);
if(!m){try{L=localStorage.getItem("lang")||"ru"}catch(e){}if(!LS.includes(L))L="ru";return location.replace(h("home"))}
L=m[1];try{localStorage.setItem("lang",L)}catch(e){}
const p=m[2],v=view(p),x=t();
document.documentElement.lang=L;document.title=(v.title?v.title+" — ":"")+(L=="ru"?"Мастер на час":L=="en"?"Handyman by the hour":"Μάστορας με την ώρα");
$('meta[name=description]').content=x.meta;
$("#logo").textContent=L=="ru"?"Мастер на час":L=="en"?"Handyman by the hour":"Μάστορας με την ώρα";$("#logo").href=h("home");
const ks=["home","services","prices","about","contacts"],cur=p.startsWith("cat-")?"services":p;
$("#nav").innerHTML=[0,1,2,4].map(i=>{const k=ks[i];return `<a href="${h(k)}"${k==cur?' class="on" aria-current="page"':""}>${x.nav[i]}</a>`}).join("");
$("#nav").classList.remove("open");$("#burger").setAttribute("aria-expanded","false");
document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l==L));
document.querySelectorAll("[data-open].hc").forEach(b=>b.textContent=x.cb);
$("#app").innerHTML=v.html;window.scrollTo(0,0);
$("#foot").innerHTML=`<div class="fg"><div><div class="logo" style="margin-bottom:8px">${$("#logo").textContent}</div><p>${x.fd}</p><p class="note">${x.ar}</p></div><div><div class="lang" style="display:inline-flex;margin-top:10px">${LS.map(l=>`<button data-l="${l}"${l==L?' class="on"':""}>${l.toUpperCase()}</button>`).join("")}</div></div></div><div style="text-align:center;margin-top:36px"><h3>${x.ct}</h3><div class="ri">${R()}</div></div><div style="max-width:720px;margin:40px auto 0;border-top:1px solid var(--line);padding-top:28px;text-align:center"><h2>${x.at}</h2>${x.ab.map(p=>`<p>${p}</p>`).join("")}</div><p class="note" style="margin-top:28px;text-align:center">© ${new Date().getFullYear()} ${$("#logo").textContent}</p>`;
$("#dlg").innerHTML=`<h2 style="font-size:1.5rem">${x.ctl}</h2><p>${x.cs}</p><div class="cta" style="flex-direction:column;align-items:center">${BS(1)}<button class="btn o" id="cl">✕</button></div>`;
$("#cl").onclick=()=>$("#dlg").close();}
document.addEventListener("click",e=>{
const l=e.target.closest("[data-l]");if(l){const m=(location.hash.slice(1)).match(/^..-(.+)$/);location.hash=l.dataset.l+"-"+(m?m[1]:"home");return}
if(e.target.closest("[data-open]")){$("#dlg").showModal();return}
const ph=e.target.closest("[data-ph]");if(ph){e.preventDefault();const n="+"+dg(CFG.phone),d2=$("#dlg2");d2.innerHTML=`<p>${t().tapc}</p><div class="cta" style="flex-direction:column;align-items:center"><button class="btn" id="cp">${n}</button></div>`;d2.showModal();$("#cp").onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).catch(()=>{const a=document.createElement("textarea");a.value=n;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()});d2.close();const o=$("#toast");o.textContent=t().copied;o.classList.add("on");setTimeout(()=>o.classList.remove("on"),2500)};return}
if(e.target.id=="dlg2"){$("#dlg2").close();return}
const d=e.target.closest("[data-empty]");if(d){e.preventDefault();const o=$("#toast");o.textContent=t().toast;o.classList.add("on");setTimeout(()=>o.classList.remove("on"),2500)}
if(e.target.closest("#dlg a:not([data-empty])"))$("#dlg").close();
if(e.target.id=="dlg")$("#dlg").close()});
$("#burger").onclick=function(){const o=$("#nav").classList.toggle("open");this.setAttribute("aria-expanded",o)};
addEventListener("hashchange",render);render();
</script>
</body>
</html>
